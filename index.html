<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color"
      content="#111827">

<meta name="mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black">

<title>Home Wall Dashboard</title>

<link rel="manifest"
      href="./manifest.json">


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #111827;

    color: white;

}


/* =====================================================
   DASHBOARD
===================================================== */

.dashboard {

    width: 100vw;
    height: 100vh;

    display: grid;

    grid-template-columns:
        22% 56% 22%;

    gap: 8px;

    padding: 8px;

    transition: opacity .4s;

}


.card {

    background: #1f2937;

    border-radius: 16px;

    padding: 16px;

}


/* =====================================================
   CLOCK
===================================================== */

.left-panel {

    overflow: hidden;

}


.clock {

    text-align: center;

    padding-top: 20px;

}


.time {

    font-size:
        clamp(45px,5vw,75px);

    font-weight: bold;

}


.date {

    font-size:
        clamp(17px,1.8vw,24px);

    color: #d1d5db;

    margin-top: 10px;

}


/* =====================================================
   WEATHER
===================================================== */

.weather {

    margin-top: 25px;

}


.weather-title {

    font-size: 21px;

    font-weight: bold;

    margin-bottom: 12px;

}


.weather-days {

    display: flex;

    flex-direction: column;

    gap: 7px;

}


.weather-day {

    background: #374151;

    border-radius: 10px;

    padding: 9px;

    display: grid;

    grid-template-columns:
        45px 1fr 60px;

    align-items: center;

}


.weather-icon {

    font-size: 27px;

    text-align: center;

}


.weather-name {

    font-size: 15px;

}


.weather-temp {

    text-align: right;

    font-weight: bold;

}


.weather-extra {

    grid-column: 2 / 4;

    font-size: 12px;

    color: #cbd5e1;

}


/* =====================================================
   CALENDAR
===================================================== */

.calendar {

    display: flex;

    flex-direction: column;

    min-width: 0;

}


.card-title {

    font-size: 24px;

    font-weight: bold;

    margin-bottom: 12px;

}


.calendar-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 10px;

}


button {

    border: 0;

    border-radius: 8px;

    color: white;

    background: #374151;

    cursor: pointer;

    user-select: none;

    -webkit-user-select: none;

}


.calendar-button {

    padding: 8px 12px;

    font-size: 16px;

}


.calendar-month {

    font-size: 20px;

    font-weight: bold;

}


.calendar-grid {

    flex: 1;

    display: grid;

    grid-template-columns:
        repeat(7,1fr);

    grid-template-rows:
        30px repeat(6,1fr);

    gap: 4px;

    min-height: 0;

}


.weekday {

    text-align: center;

    color: #9ca3af;

    font-weight: bold;

    padding: 5px;

}


.calendar-cell {

    background: #374151;

    border-radius: 8px;

    padding: 6px;

    overflow: hidden;

    min-width: 0;

}


.calendar-cell.today {

    outline: 2px solid #60a5fa;

}


.day-number {

    font-weight: bold;

    font-size: 14px;

}


.event {

    margin-top: 4px;

    background: #2563eb;

    border-radius: 5px;

    padding: 3px 5px;

    font-size: 11px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


.no-calendar {

    grid-column: 1 / 8;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #374151;

    border-radius: 12px;

    text-align: center;

    color: #d1d5db;

}


/* =====================================================
   RIGHT SIDE
===================================================== */

.right-panel {

    display: flex;

    flex-direction: column;

    gap: 8px;

    min-width: 0;

}


.notes {

    flex: 1;

    min-height: 0;

    display: flex;

    flex-direction: column;

}


textarea {

    width: 100%;

    height: 90px;

    resize: none;

    border: 0;

    border-radius: 10px;

    padding: 12px;

    font-size: 16px;

    background: #374151;

    color: white;

    user-select: text;

    -webkit-user-select: text;

}


.add-button {

    padding: 11px;

    margin-top: 8px;

    background: #2563eb;

    font-size: 16px;

}


#notesList {

    margin-top: 10px;

    overflow-y: auto;

}


.note {

    background: #374151;

    border-radius: 10px;

    padding: 9px;

    margin-bottom: 7px;

    display: flex;

    gap: 8px;

}


.note-text {

    flex: 1;

    word-break: break-word;

}


.delete {

    padding: 5px 9px;

}


/* =====================================================
   RING
===================================================== */

.ring {

    height: 25%;

    display: flex;

    flex-direction: column;

}


.ring-button {

    flex: 1;

    background: #374151;

    font-size: 22px;

    font-weight: bold;

}


.ring-small {

    display: block;

    font-size: 13px;

    color: #d1d5db;

    margin-top: 8px;

}


/* =====================================================
   SETTINGS BUTTON
===================================================== */

.settings-button {

    position: fixed;

    right: 15px;

    bottom: 10px;

    z-index: 1000;

    width: 48px;

    height: 48px;

    border-radius: 50%;

    background: #374151;

    font-size: 23px;

    user-select: none;

    -webkit-user-select: none;

    touch-action: manipulation;

}


/* =====================================================
   SETTINGS WINDOW
===================================================== */

.settings-overlay {

    position: fixed;

    inset: 0;

    z-index: 2000;

    background: rgba(0,0,0,.75);

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

}


.settings-panel {

    width: min(650px,95vw);

    max-height: 90vh;

    overflow-y: auto;

    background: #1f2937;

    border-radius: 18px;

    padding: 22px;

    user-select: text;

    -webkit-user-select: text;

}


.setting-section {

    background: #374151;

    border-radius: 12px;

    padding: 15px;

    margin-top: 12px;

}


.setting-section h3 {

    margin-top: 0;

}


.setting-row {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin: 10px 0;

}


input[type="time"] {

    background: #111827;

    color: white;

    border: 1px solid #6b7280;

    border-radius: 8px;

    padding: 8px;

    font-size: 16px;

}


input[type="range"] {

    width: 150px;

}


.sign-in {

    background: #059669;

    padding: 10px 14px;

    font-size: 16px;

}


.account {

    background: #1f2937;

    border-radius: 10px;

    padding: 12px;

    margin-top: 10px;

}


.account-title {

    font-weight: bold;

    margin-bottom: 8px;

}


.calendar-setting {

    background: #374151;

    padding: 9px;

    border-radius: 8px;

    margin-top: 6px;

}


.remove-account {

    background: #991b1b;

    padding: 7px 10px;

    margin-bottom: 8px;

}


.close-settings {

    width: 100%;

    background: #2563eb;

    padding: 12px;

    margin-top: 15px;

    font-size: 16px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px) {

    .dashboard {

        grid-template-columns:
            1fr 1fr;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     MAIN DASHBOARD
===================================================== -->

<div class="dashboard">


    <!-- LEFT -->

    <div class="card left-panel">

        <div class="clock">

            <div class="time"
                 id="time">
                12:00 AM
            </div>

            <div class="date"
                 id="date">
                Loading...
            </div>

        </div>


        <div class="weather">

            <div class="weather-title">
                🌤️ Whitehaven Weather
            </div>

            <div class="weather-days"
                 id="weatherDays">
                Loading weather...
            </div>

        </div>

    </div>


    <!-- CALENDAR -->

    <div class="card calendar">

        <div class="card-title">
            📅 Calendar
        </div>


        <div class="calendar-header">

            <button
                class="calendar-button"
                onclick="changeMonth(-1)">
                ◀
            </button>


            <div
                class="calendar-month"
                id="calendarMonth">
            </div>


            <button
                class="calendar-button"
                onclick="changeMonth(1)">
                ▶
            </button>

        </div>


        <div
            id="calendarGrid"
            class="calendar-grid">

            <div class="no-calendar">

                Open ⚙️ and add your
                Google account

            </div>

        </div>

    </div>


    <!-- RIGHT -->

    <div class="right-panel">


        <div class="card notes">

            <div class="card-title">
                📝 Notes & Reminders
            </div>


            <textarea
                id="noteInput"
                placeholder="Leave a message or reminder...">
            </textarea>


            <button
                class="add-button"
                onclick="addNote()">

                Add Note

            </button>


            <div id="notesList"></div>

        </div>


        <div class="card ring">

            <div class="card-title">
                🔔 Ring Doorbell
            </div>


            <button
                class="ring-button"
                onclick="openRing()">

                🔔 Open Ring

                <span class="ring-small">

                    Tap to access your doorbell

                </span>

            </button>

        </div>


    </div>


</div>


<!-- =====================================================
     SETTINGS BUTTON
===================================================== -->

<button
    class="settings-button"
    id="settingsButton">

    ⚙️

</button>


<!-- =====================================================
     SETTINGS
===================================================== -->

<div
    class="settings-overlay"
    id="settingsOverlay">


    <div class="settings-panel">


        <h2>
            ⚙️ Dashboard Settings
        </h2>


        <!-- GOOGLE -->

        <div class="setting-section">

            <h3>
                📅 Google Calendars
            </h3>


            <p style="color:#d1d5db">

                Add as many Google accounts
                as you need.

            </p>


            <button
                class="sign-in"
                id="addAccountButton">

                ➕ Add Google Account

            </button>


            <div id="accounts"></div>

        </div>


        <!-- NIGHT MODE -->

        <div class="setting-section">

            <h3>
                🌙 Night Mode
            </h3>


            <div class="setting-row">

                <span>
                    Enable
                </span>

                <input
                    type="checkbox"
                    id="nightEnabled">

            </div>


            <div class="setting-row">

                <span>
                    Dim starts
                </span>

                <input
                    type="time"
                    id="nightStart">

            </div>


            <div class="setting-row">

                <span>
                    Dim ends
                </span>

                <input
                    type="time"
                    id="nightEnd">

            </div>


            <div class="setting-row">

                <span>
                    Dim level
                </span>

                <input
                    type="range"
                    id="dimLevel"
                    min="5"
                    max="80">

            </div>


            <div class="setting-row">

                <span>
                    Wake duration
                </span>


                <select
                    id="wakeDuration"
                    style="
                    background:#111827;
                    color:white;
                    padding:8px;
                    border-radius:8px;
                    ">

                    <option value="10">
                        10 seconds
                    </option>

                    <option value="30">
                        30 seconds
                    </option>

                    <option value="60">
                        1 minute
                    </option>

                    <option value="120">
                        2 minutes
                    </option>

                </select>

            </div>

        </div>


        <button
            class="close-settings"
            id="closeSettingsButton">

            Done

        </button>


    </div>

</div>


<script src="https://accounts.google.com/gsi/client">
</script>


<script>

/* =====================================================
   GOOGLE CONFIGURATION
===================================================== */

const CLIENT_ID =
    "72191431208-jja4m5r8kdkndatn8ee2qgmnlgum8eeh.apps.googleusercontent.com";


const CALENDAR_SCOPE =
    "https://www.googleapis.com/auth/calendar.readonly";


/* =====================================================
   GOOGLE ACCOUNTS
===================================================== */

let googleAccounts = [];

let events = [];

let displayedMonth = new Date();


/* =====================================================
   ADD GOOGLE ACCOUNT
===================================================== */

function addGoogleAccount() {

    if (
        !window.google ||
        !google.accounts ||
        !google.accounts.oauth2
    ) {

        alert(
            "Google sign-in is still loading. Please try again."
        );

        return;

    }


    const client =
        google.accounts.oauth2.initTokenClient({

            client_id: CLIENT_ID,

            scope: CALENDAR_SCOPE,

            callback: async function(response) {

                if (
                    response.error
                ) {

                    alert(
                        "Google sign-in failed: " +
                        response.error
                    );

                    return;

                }


                const account = {

                    id:
                        "account-" +
                        Date.now(),

                    token:
                        response.access_token,

                    calendars: [],

                    selected: []

                };


                googleAccounts.push(
                    account
                );


                await loadAccountCalendars(
                    account
                );


                displayAccounts();

                await loadAllEvents();

            }

        });


    client.requestAccessToken({

        prompt: "select_account"

    });

}


/* =====================================================
   LOAD CALENDARS
===================================================== */

async function loadAccountCalendars(
    account
) {

    try {

        const response =
            await fetch(

                "https://www.googleapis.com/calendar/v3/users/me/calendarList",

                {

                    headers: {

                        Authorization:
                            "Bearer " +
                            account.token

                    }

                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Calendar access failed"
            );

        }


        const data =
            await response.json();


        account.calendars =
            data.items || [];


        account.selected =
            account.calendars.map(
                calendar =>
                    calendar.id
            );


    }

    catch(error) {

        console.error(error);

        alert(
            "I couldn't load the calendars for this Google account."
        );

    }

}


/* =====================================================
   DISPLAY ACCOUNTS
===================================================== */

function displayAccounts() {

    const container =
        document.getElementById(
            "accounts"
        );


    container.innerHTML = "";


    if (
        googleAccounts.length === 0
    ) {

        container.innerHTML =

            `<p style="color:#9ca3af">
                No Google accounts connected yet.
             </p>`;

        return;

    }


    googleAccounts.forEach(
        function(account,index) {

            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "account";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "account-title";


            title.textContent =
                "Google Account " +
                (index + 1);


            box.appendChild(
                title
            );


            const remove =
                document.createElement(
                    "button"
                );


            remove.className =
                "remove-account";


            remove.textContent =
                "Remove account";


            remove.onclick =
                function() {

                    googleAccounts.splice(
                        index,
                        1
                    );

                    displayAccounts();

                    loadAllEvents();

                };


            box.appendChild(
                remove
            );


            account.calendars.forEach(
                function(calendar) {


                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "calendar-setting";


                    const label =
                        document.createElement(
                            "label"
                        );


                    const checkbox =
                        document.createElement(
                            "input"
                        );


                    checkbox.type =
                        "checkbox";


                    checkbox.checked =
                        account.selected.includes(
                            calendar.id
                        );


                    checkbox.onchange =
                        function() {

                            if (
                                checkbox.checked
                            ) {

                                if (
                                    !account.selected.includes(
                                        calendar.id
                                    )
                                ) {

                                    account.selected.push(
                                        calendar.id
                                    );

                                }

                            }

                            else {

                                account.selected =
                                    account.selected.filter(
                                        id =>
                                            id !==
                                            calendar.id
                                    );

                            }


                            loadAllEvents();

                        };


                    label.appendChild(
                        checkbox
                    );


                    label.appendChild(
                        document.createTextNode(

                            " " +
                            (
                                calendar.summary ||
                                "Calendar"
                            )

                        )
                    );


                    row.appendChild(
                        label
                    );


                    box.appendChild(
                        row
                    );

                }
            );


            container.appendChild(
                box
            );

        }
    );

}


/* =====================================================
   LOAD ALL EVENTS
===================================================== */

async function loadAllEvents() {

    events = [];


    for (
        const account
        of googleAccounts
    ) {


        for (
            const calendarId
            of account.selected
        ) {


            try {

                const year =
                    displayedMonth.getFullYear();


                const month =
                    displayedMonth.getMonth();


                const start =
                    new Date(
                        year,
                        month,
                        1
                    ).toISOString();


                const end =
                    new Date(
                        year,
                        month + 1,
                        1
                    ).toISOString();


                const url =

                    "https://www.googleapis.com/calendar/v3/calendars/" +

                    encodeURIComponent(
                        calendarId
                    ) +

                    "/events" +

                    "?singleEvents=true" +

                    "&orderBy=startTime" +

                    "&timeMin=" +

                    encodeURIComponent(
                        start
                    ) +

                    "&timeMax=" +

                    encodeURIComponent(
                        end
                    ) +

                    "&maxResults=250";


                const response =
                    await fetch(
                        url,
                        {

                            headers: {

                                Authorization:
                                    "Bearer " +
                                    account.token

                            }

                        }
                    );


                if (
                    !response.ok
                )
                    continue;


                const data =
                    await response.json();


                (
                    data.items || []
                ).forEach(
                    event => {

                        events.push(
                            event
                        );

                    }
                );

            }

            catch(error) {

                console.error(error);

            }

        }

    }


    drawCalendar();

}


/* =====================================================
   CALENDAR
===================================================== */

function changeMonth(
    amount
) {

    displayedMonth.setMonth(

        displayedMonth.getMonth()
        + amount

    );


    loadAllEvents();

}


function drawCalendar() {

    const grid =
        document.getElementById(
            "calendarGrid"
        );


    grid.innerHTML = "";


    const year =
        displayedMonth.getFullYear();


    const month =
        displayedMonth.getMonth();


    document.getElementById(
        "calendarMonth"
    ).textContent =

        displayedMonth.toLocaleDateString(
            "en-GB",
            {
                month: "long",
                year: "numeric"
            }
        );


    const weekdays = [

        "Mon",
        "Tue",
        "Wed",
        "Thu",
        "Fri",
        "Sat",
        "Sun"

    ];


    weekdays.forEach(
        day => {

            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "weekday";


            cell.textContent =
                day;


            grid.appendChild(
                cell
            );

        }
    );


    const firstDay =
        new Date(
            year,
            month,
            1
        );


    let startingDay =
        firstDay.getDay();


    startingDay =
        startingDay === 0
        ? 6
        : startingDay - 1;


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for (
        let i = 0;
        i < startingDay;
        i++
    ) {

        const blank =
            document.createElement(
                "div"
            );


        blank.className =
            "calendar-cell";


        grid.appendChild(
            blank
        );

    }


    const today =
        new Date();


    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {


        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "calendar-cell";


        if (

            day ===
                today.getDate()

            &&

            month ===
                today.getMonth()

            &&

            year ===
                today.getFullYear()

        ) {

            cell.classList.add(
                "today"
            );

        }


        const number =
            document.createElement(
                "div"
            );


        number.className =
            "day-number";


        number.textContent =
            day;


        cell.appendChild(
            number
        );


        events
            .filter(
                event => {

                    const date =
                        new Date(

                            event.start.dateTime ||
                            event.start.date

                        );


                    return (

                        date.getFullYear()
                        === year

                        &&

                        date.getMonth()
                        === month

                        &&

                        date.getDate()
                        === day

                    );

                }
            )

            .slice(0,4)

            .forEach(
                event => {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "event";


                    const date =
                        new Date(

                            event.start.dateTime ||
                            event.start.date

                        );


                    let title =
                        event.summary ||
                        "(No title)";


                    if (
                        event.start.dateTime
                    ) {

                        title =

                            date.toLocaleTimeString(
                                "en-GB",
                                {
                                    hour:
                                        "numeric",
                                    minute:
                                        "2-digit"
                                }
                            )

                            + " " +

                            title;

                    }


                    item.textContent =
                        title;


                    item.title =
                        title;


                    cell.appendChild(
                        item
                    );

                }
            );


        grid.appendChild(
            cell
        );

    }

}


/* =====================================================
   CLOCK
===================================================== */

function updateClock() {

    const now =
        new Date();


    document.getElementById(
        "time"
    ).textContent =

        now.toLocaleTimeString(
            "en-GB",
            {
                hour: "numeric",
                minute: "2-digit",
                hour12: true
            }
        );


    document.getElementById(
        "date"
    ).textContent =

        now.toLocaleDateString(
            "en-GB",
            {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

}


updateClock();


setInterval(
    updateClock,
    1000
);


/* =====================================================
   WEATHER
===================================================== */

const latitude =
    54.548;


const longitude =
    -3.586;


async function loadWeather() {

    try {

        const url =

            "https://api.open-meteo.com/v1/forecast" +

            "?latitude=" +
            latitude +

            "&longitude=" +
            longitude +

            "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +

            "&timezone=Europe%2FLondon" +

            "&forecast_days=5";


        const response =
            await fetch(
                url
            );


        const data =
            await response.json();


        const box =
            document.getElementById(
                "weatherDays"
            );


        box.innerHTML = "";


        for (
            let i = 0;
            i < 5;
            i++
        ) {


            const date =
                new Date(

                    data.daily.time[i]
                    + "T12:00:00"

                );


            const name =

                i === 0

                ? "Today"

                :

                date.toLocaleDateString(
                    "en-GB",
                    {
                        weekday: "short"
                    }
                );


            const code =
                data.daily.weather_code[i];


            const high =
                Math.round(
                    data.daily.temperature_2m_max[i]
                );


            const low =
                Math.round(
                    data.daily.temperature_2m_min[i]
                );


            const rain =
                data.daily.precipitation_probability_max[i];


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "weather-day";


            row.innerHTML = `

                <div class="weather-icon">
                    ${weatherIcon(code)}
                </div>

                <div class="weather-name">
                    <strong>${name}</strong><br>
                    ${weatherDescription(code)}
                </div>

                <div class="weather-temp">
                    ${high}° / ${low}°
                </div>

                <div class="weather-extra">
                    💧 ${rain}% chance of rain
                </div>

            `;


            box.appendChild(
                row
            );

        }

    }

    catch {

        document.getElementById(
            "weatherDays"
        ).textContent =
            "Weather unavailable";

    }

}


function weatherIcon(
    code
) {

    if (
        code === 0
    )
        return "☀️";


    if (
        code <= 3
    )
        return "🌤️";


    if (
        code <= 48
    )
        return "🌫️";


    if (
        code <= 67
    )
        return "🌧️";


    if (
        code <= 77
    )
        return "🌨️";


    if (
        code <= 82
    )
        return "🌦️";


    if (
        code <= 86
    )
        return "🌨️";


    if (
        code >= 95
    )
        return "⛈️";


    return "🌤️";

}


function weatherDescription(
    code
) {

    if (
        code === 0
    )
        return "Clear";


    if (
        code <= 3
    )
        return "Partly cloudy";


    if (
        code <= 48
    )
        return "Foggy";


    if (
        code <= 55
    )
        return "Drizzle";


    if (
        code <= 67
    )
        return "Rain";


    if (
        code <= 77
    )
        return "Snow";


    if (
        code <= 82
    )
        return "Showers";


    if (
        code <= 86
    )
        return "Snow showers";


    if (
        code >= 95
    )
        return "Thunderstorm";


    return "Cloudy";

}

let notes =
    JSON.parse(

        localStorage.getItem(
            "dashboardNotes"
        )

        || "[]"

    );


function displayNotes() {

    const box =
        document.getElementById(
            "notesList"
        );


    box.innerHTML = "";


    notes.forEach(
        (note,index) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "note";


            const text =
                document.createElement(
                    "div"
                );


            text.className =
                "note-text";


            text.textContent =
                note;


            const del =
                document.createElement(
                    "button"
                );


            del.className =
                "delete";


            del.textContent =
                "✓";


            del.onclick =
                function() {

                    notes.splice(
                        index,
                        1
                    );


                    saveNotes();

                };


            row.appendChild(
                text
            );


            row.appendChild(
                del
            );


            box.appendChild(
                row
            );

        }
    );

}


function addNote() {

    const input =
        document.getElementById(
            "noteInput"
        );


    const text =
        input.value.trim();


    if (
        !text
    )
        return;


    notes.unshift(
        text
    );


    input.value =
        "";


    saveNotes();

}


function saveNotes() {

    localStorage.setItem(

        "dashboardNotes",

        JSON.stringify(
            notes
        )

    );


    displayNotes();

}


displayNotes();


/* =====================================================
   NIGHT MODE
===================================================== */

let settings =

    JSON.parse(

        localStorage.getItem(
            "dashboardSettings"
        )

        || "{}"

    );


settings.nightEnabled =
    settings.nightEnabled
    ?? true;


settings.nightStart =
    settings.nightStart
    ?? "22:30";


settings.nightEnd =
    settings.nightEnd
    ?? "07:00";


settings.dimLevel =
    settings.dimLevel
    ?? 18;


settings.wakeDuration =
    settings.wakeDuration
    ?? 30;


function loadSettings() {

    document.getElementById(
        "nightEnabled"
    ).checked =
        settings.nightEnabled;


    document.getElementById(
        "nightStart"
    ).value =
        settings.nightStart;


    document.getElementById(
        "nightEnd"
    ).value =
        settings.nightEnd;


    document.getElementById(
        "dimLevel"
    ).value =
        settings.dimLevel;


    document.getElementById(
        "wakeDuration"
    ).value =
        settings.wakeDuration;

}


function saveSettings() {

    settings.nightEnabled =

        document.getElementById(
            "nightEnabled"
        ).checked;


    settings.nightStart =

        document.getElementById(
            "nightStart"
        ).value;


    settings.nightEnd =

        document.getElementById(
            "nightEnd"
        ).value;


    settings.dimLevel =

        document.getElementById(
            "dimLevel"
        ).value;


    settings.wakeDuration =

        document.getElementById(
            "wakeDuration"
        ).value;


    localStorage.setItem(

        "dashboardSettings",

        JSON.stringify(
            settings
        )

    );


    applyDim();

}


function minutes(
    value
) {

    const parts =
        value.split(":");


    return (

        Number(parts[0]) * 60
        +
        Number(parts[1])

    );

}


function isNight() {

    const now =
        new Date();


    const current =

        now.getHours() * 60
        +
        now.getMinutes();


    const start =
        minutes(
            settings.nightStart
        );


    const end =
        minutes(
            settings.nightEnd
        );


    if (
        start < end
    ) {

        return (

            current >= start
            &&
            current < end

        );

    }


    return (

        current >= start
        ||
        current < end

    );

}


function applyDim() {

    const dashboard =
        document.querySelector(
            ".dashboard"
        );


    if (

        settings.nightEnabled
        &&
        isNight()

    ) {

        dashboard.style.opacity =

            settings.dimLevel / 100;

    }

    else {

        dashboard.style.opacity =
            "1";

    }

}


let wakeTimer;


document.addEventListener(
    "click",
    function(event) {

        if (
            event.target.closest(
                ".settings-overlay"
            )
        )
            return;


        if (

            settings.nightEnabled
            &&
            isNight()

        ) {

            const dashboard =
                document.querySelector(
                    ".dashboard"
                );


            dashboard.style.opacity =
                "1";


            clearTimeout(
                wakeTimer
            );


            wakeTimer =

                setTimeout(

                    applyDim,

                    settings.wakeDuration
                    * 1000

                );

        }

    }
);


setInterval(
    applyDim,
    30000
);
